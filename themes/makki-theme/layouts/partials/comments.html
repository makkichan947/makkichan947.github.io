{{ if and .Params.comments .Site.Params.utteranc.enable }}
<div class="comments">
  <h2 class="comments-title">评论</h2>
  <div id="utterances"></div>
  <script>
    (function () {
      if (window.location.protocol === 'file:') return;
      var s = document.createElement('script');
      s.src = 'https://utteranc.es/client.js';
      s.async = true;
      s.setAttribute('repo', {{ .Site.Params.utteranc.repo | jsonify }});
      s.setAttribute('issue-term', {{ .Site.Params.utteranc.issueTerm | jsonify }});
      s.setAttribute('theme', {{ .Site.Params.utteranc.theme | jsonify }});
      s.setAttribute('crossorigin', 'anonymous');
      document.getElementById('utterances').appendChild(s);
    })();
  </script>
</div>
{{ end }}
