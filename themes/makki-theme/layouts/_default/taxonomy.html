{{ define "main" }}
<header class="page-head">
  <h1>标签：{{ .Title }}</h1>
</header>

<div class="card-grid">
  {{ range $i, $p := .Pages }}
  <article class="card" data-press data-reveal data-reveal-delay="{{ mod $i 6 }}45">
    <h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>
    <p>{{ $p.Summary | truncate 110 }}</p>
    <div class="meta">
      {{ if $p.Date }}<time datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006-01-02" }}</time>{{ end }}
      <span class="section">{{ $p.Section }}</span>
    </div>
  </article>
  {{ end }}
</div>
{{ template "_internal/pagination.html" . }}
{{ end }}
